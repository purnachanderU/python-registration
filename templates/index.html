<!DOCTYPE html>

<html>

<head>

    <title>User Registration</title>

</head>

<body>

    <h1>User Registration</h1>

    {% if message %}

        <h3>{{ message }}</h3>

    {% endif %}


    <form method="POST">

        <label>User Name:</label>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>


        <label>Course Name:</label>

        <input
            type="text"
            name="course_name"
            required
        >

        <br><br>


        <label>Country:</label>

        <input
            type="text"
            name="country"
            required
        >

        <br><br>


        <button type="submit">
            Register
        </button>

    </form>

</body>

</html>

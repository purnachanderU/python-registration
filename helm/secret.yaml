apiVersion: v1
kind: Secret
metadata:
  name: {{ include "python-registration.fullname" . }}-mysql
type: Opaque
stringData:
  root-password: {{ .Values.mysql.rootPassword | quote }}
  database: {{ .Values.mysql.database | quote }}
  username: {{ .Values.mysql.username | quote }}
  password: {{ .Values.mysql.password | quote }}

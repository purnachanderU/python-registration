nameOverride: ""
fullnameOverride: ""

pythonApp:
  replicaCount: 1

  image:
    repository: "208357522135.dkr.ecr.us-east-1.amazonaws.com/python-registration"
    tag: "1.0"
    pullPolicy: IfNotPresent

  service:
    type: LoadBalancer
    port: 5000
    targetPort: 5000

  containerPort: 5000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent

  service:
    port: 3306

  containerPort: 3306

  database: registration
  username: registration
  password: registration123
  rootPassword: root123

  persistence:
    enabled: true
    storageClass: gp3
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
